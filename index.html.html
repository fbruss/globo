<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão da Entrega Multiplataforma</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
  color: #1e293b;
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  width: 100%;
  min-height: 100vh;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  font-size: 32px;
  font-weight: 700;
  color: #0f172a;
}

.control-panel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.6);
  padding: 16px 20px;
  border-radius: 22px;
  margin-bottom: 20px;
  box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
}

.toolbar-left,
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.layer-box {
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  border: 1px solid #dbe4f0;
  padding: 12px 14px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
}

.calendar-title {
  font-size: 22px;
  font-weight: 700;
  min-width: 220px;
  text-align: center;
}

button,
select,
input,
textarea {
  font-family: 'Inter', sans-serif;
}

button {
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-weight: 600;
}

button:hover {
  transform: translateY(-1px);
}

.nav-btn {
  width: 42px;
  height: 42px;
  font-size: 18px;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: white;
}

.primary-btn {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: white;
  padding: 12px 16px;
}

.secondary-btn {
  background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
  color: white;
  padding: 12px 16px;
}

.danger-btn {
  background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
  color: white;
  padding: 12px 16px;
}

.ghost-btn {
  background: #e2e8f0;
  color: #1e293b;
  padding: 12px 16px;
}

select,
input,
textarea {
  border: 1px solid #dbe4f0;
  border-radius: 12px;
  padding: 11px 12px;
  background: white;
}

.calendar-wrapper {
  max-width: 1380px;
  margin: 0 auto;
  transform: scale(0.96);
  transform-origin: top center;
  position: relative;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(14px);
  border-radius: 26px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.7);
  box-shadow: 0 14px 50px rgba(15, 23, 42, 0.08);
}

#calendar {
  width: 100%;
  min-height: 720px;
}

.fc-theme-standard td,
.fc-theme-standard th {
  border-color: #dbe4f0;
}

.fc-daygrid-day.fc-day-sat,
.fc-daygrid-day.fc-day-sun,
.fc-timegrid-col.fc-day-sat,
.fc-timegrid-col.fc-day-sun {
  background: #e5e7eb !important;
}

.fc-multimonth-daygrid-table .fc-day-sat,
.fc-multimonth-daygrid-table .fc-day-sun {
  background: #e5e7eb !important;
}

.fc-toolbar {
  display: none !important;
}

.fc {
  background: transparent;
}

.fc-day-sat,
.fc-day-sun {
  background: #f1f5f9 !important;
}

.fc-col-header-cell {
  background: #eff6ff;
  font-weight: 700;
}

.fc-event {
  cursor: pointer;
  border: none !important;
  border-radius: 10px !important;
  padding: 3px 6px !important;
  font-size: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

.fc-event-main {
  position: relative;
  padding: 2px;
}

.event-owner {
  font-size: 11px;
  font-weight: 700;
}

.event-title {
  font-size: 11px;
}

.filters-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.legend-floating {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 14px;
  width: 100%;
  border: 1px solid #dbe4f0;
  box-shadow: 0 12px 25px rgba(15,23,42,0.12);
  z-index: 10;
}

.legend-floating h3 {
  margin-bottom: 0;
  font-size: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0;
  font-size: 13px;
}

.legend-color {
  width: 14px;
  height: 14px;
  border-radius: 4px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 760px;
  background: white;
  border-radius: 28px;
  padding: 24px;
  box-shadow: 0 25px 60px rgba(15,23,42,0.2);
}

.modal h2 {
  margin-bottom: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.warning {
  color: #dc2626;
  font-size: 13px;
  margin-top: 10px;
  font-weight: 600;
}

.event-tooltip {
  position: absolute;
  z-index: 9999;
  background: rgba(15,23,42,0.96);
  color: white;
  padding: 14px;
  border-radius: 14px;
  width: 280px;
  box-shadow: 0 14px 30px rgba(0,0,0,0.25);
  font-size: 12px;
  line-height: 1.5;
  pointer-events: none;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
}

.event-tooltip strong {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
}

.custom-delete-modal {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
}

.custom-delete-content {
  width: 420px;
  background: white;
  border-radius: 18px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.danger-btn,
.neutral-btn {
  border: none;
  border-radius: 12px;
  padding: 12px;
  font-weight: 600;
  cursor: pointer;
}

.danger-btn {
  background: #dc2626;
  color: white;
}

.danger-btn.secondary {
  background: #7c3aed;
}

.neutral-btn {
  background: #e5e7eb;
}

.event-tooltip-row {
  margin-bottom: 4px;
}

@media(max-width: 900px) {

  .form-grid {
    grid-template-columns: 1fr;
  }

  .control-panel {
    flex-direction: column;
    align-items: stretch;
  }

  .toolbar-left,
  .toolbar-right {
    justify-content: center;
  }

  .legend-floating {
    justify-content: center;
    gap: 10px;
  }

}

</style>
</head>
<body>

<div class="app">

  <div class="header">
    <h1>Gestão da Entrega Multiplataforma</h1>
  </div>

  <div class="control-panel">

    <div class="toolbar-left">

      <button class="nav-btn" id="prevBtn">←</button>

      <div class="calendar-title" id="calendarTitle"></div>

      <button class="nav-btn" id="nextBtn">→</button>

    </div>

    <div class="toolbar-right filters-row">

      <div class="layer-box">

        <select id="periodFilter">
          <option value="month">Mensal</option>
          <option value="week">Semanal</option>
          <option value="year">Anual</option>
        </select>

        <select id="categoryFilter"></select>

        <select id="personFilter"></select>

      </div>

      <button class="primary-btn" id="newEventBtn">
        Novo Evento
      </button>

      <button class="secondary-btn" id="newCategoryBtn">
        Nova Categoria
      </button>

    </div>

  </div>

  <div class="calendar-wrapper">

    <div class="legend-floating">
      <h3>Legenda:</h3>
      <div id="legendContainer" style="display:flex; gap:14px; flex-wrap:wrap;"></div>
    </div>

    <div id="calendar"></div>

  </div>

</div>

<div class="modal-overlay" id="eventModalOverlay">

  <div class="modal">

    <h2>Evento</h2>

    <input type="hidden" id="eventId">

    <div class="form-grid">

      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="eventOwner">
      </div>

      <div class="form-group">
        <label>Evento</label>
        <input type="text" id="eventTitleInput">
      </div>

      <div class="form-group">
        <label>Categoria</label>
        <select id="eventCategory"></select>
      </div>

      <div class="form-group">
        <label>Data</label>
        <input type="date" id="eventDate">
      </div>

      <div class="form-group">
        <label>Recorrência</label>
        <select id="eventRecurrence">
          <option value="none">Sem recorrência</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensal</option>
        </select>
      </div>

      <div class="form-group">
        <label>Hora</label>
        <input type="time" id="eventTime">
      </div>

      <div class="form-group full">
        <label>Convidados</label>
        <input type="text" id="eventGuests">
      </div>

      <div class="form-group full">
        <label>Descrição</label>
        <textarea rows="4" id="eventDescription"></textarea>
      </div>

    </div>

    <div class="modal-actions">
      <button class="ghost-btn" id="cancelEventBtn">Cancelar</button>
      <button class="danger-btn" id="deleteEventBtn">Excluir</button>
      <button class="primary-btn" id="saveEventBtn">Salvar</button>
    </div>

  </div>

</div>

<div class="modal-overlay" id="categoryModalOverlay">

  <div class="modal" style="max-width: 480px;">

    <h2>Nova Categoria</h2>

    <div class="form-grid">

      <div class="form-group full">
        <label>Tipo de Evento</label>
        <input type="text" id="categoryName">
      </div>

      <div class="form-group full">
        <label>Cor</label>
        <input type="color" id="categoryColor" value="#2563EB">
      </div>

    </div>

    <div class="warning" id="categoryWarning"></div>

    <div class="modal-actions">
      <button class="ghost-btn" id="cancelCategoryBtn">Cancelar</button>
      <button class="secondary-btn" id="saveCategoryBtn">Salvar Categoria</button>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>

// =========================================================
// CATEGORY DATA
// =========================================================

let categories = [
  { id: 1, name: 'Reunião', color: '#2563EB' },
  { id: 2, name: 'Férias', color: '#DC2626' },
  { id: 3, name: 'Day Off', color: '#7C3AED' },
  { id: 4, name: 'Evento', color: '#16A34A' },
  { id: 5, name: 'Feriado', color: '#F59E0B' }
];

// =========================================================
// BRAZIL HOLIDAYS
// =========================================================

const brazilHolidays = [
  ['2026-01-01','Confraternização Universal'],
  ['2026-04-03','Paixão de Cristo'],
  ['2026-04-21','Tiradentes'],
  ['2026-05-01','Dia do Trabalho'],
  ['2026-09-07','Independência do Brasil'],
  ['2026-10-12','Nossa Senhora Aparecida'],
  ['2026-11-02','Finados'],
  ['2026-11-15','Proclamação da República'],
  ['2026-12-25','Natal'],

  ['2027-01-01','Confraternização Universal'],
  ['2027-03-26','Paixão de Cristo'],
  ['2027-04-21','Tiradentes'],
  ['2027-05-01','Dia do Trabalho'],
  ['2027-09-07','Independência do Brasil'],
  ['2027-10-12','Nossa Senhora Aparecida'],
  ['2027-11-02','Finados'],
  ['2027-11-15','Proclamação da República'],
  ['2027-12-25','Natal'],

  ['2028-01-01','Confraternização Universal'],
  ['2028-04-14','Paixão de Cristo'],
  ['2028-04-21','Tiradentes'],
  ['2028-05-01','Dia do Trabalho'],
  ['2028-09-07','Independência do Brasil'],
  ['2028-10-12','Nossa Senhora Aparecida'],
  ['2028-11-02','Finados'],
  ['2028-11-15','Proclamação da República'],
  ['2028-12-25','Natal'],

  ['2029-01-01','Confraternização Universal'],
  ['2029-03-30','Paixão de Cristo'],
  ['2029-04-21','Tiradentes'],
  ['2029-05-01','Dia do Trabalho'],
  ['2029-09-07','Independência do Brasil'],
  ['2029-10-12','Nossa Senhora Aparecida'],
  ['2029-11-02','Finados'],
  ['2029-11-15','Proclamação da República'],
  ['2029-12-25','Natal'],

  ['2030-01-01','Confraternização Universal'],
  ['2030-04-19','Paixão de Cristo'],
  ['2030-04-21','Tiradentes'],
  ['2030-05-01','Dia do Trabalho'],
  ['2030-09-07','Independência do Brasil'],
  ['2030-10-12','Nossa Senhora Aparecida'],
  ['2030-11-02','Finados'],
  ['2030-11-15','Proclamação da República'],
  ['2030-12-25','Natal']
];

// =========================================================
// EVENTS
// =========================================================

let recurrenceEditMode = 'single';

let events = [
  {
    id: '1',
    title: 'Sprint Review',
    start: '2026-05-08',
    backgroundColor: '#2563EB',
    borderColor: '#2563EB',
    extendedProps: {
      owner: 'Fernando',
      category: 'Reunião',
      recurrenceGroup: 'group-100'
    }
  },
  {
    id: '2',
    title: 'Integração Plataforma',
    start: '2026-05-15',
    backgroundColor: '#16A34A',
    borderColor: '#16A34A',
    extendedProps: {
      owner: 'Amanda',
      category: 'Evento',
      recurrenceGroup: 'group-200'
    }
  }
];

brazilHolidays.forEach((holiday, index) => {
  events.push({
    id: 'holiday-' + index,
    title: holiday[1],
    start: holiday[0],
    allDay: true,
    backgroundColor: '#F59E0B',
    borderColor: '#F59E0B',
    editable: false,
    extendedProps: {
      owner: 'Brasil',
      category: 'Feriado'
    }
  });
});

// =========================================================
// CALENDAR
// =========================================================

const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

  initialView: 'dayGridMonth',
  locale: 'pt-br',
  editable: true,
  selectable: true,
  dayMaxEvents: true,
  events: events,

  eventContent(arg) {
    return {
      html: `
      <div>
        <div class="event-owner">${arg.event.extendedProps.owner}</div>
        <div class="event-title">${arg.event.title}</div>
      </div>
      `
    };
  },

  dateClick(info) {
    clearEventModal();
    document.getElementById('eventDate').value = info.dateStr;
    openEventModal();
  },

  eventClick(info) {

    try {

      // Fecha qualquer tooltip aberta antes de abrir edição
      document.querySelectorAll('.event-tooltip').forEach(tooltip => {
        tooltip.remove();
      });

      recurrenceEditMode = 'single';

      fillEventModal(info.event);
      openEventModal();

    } catch (error) {

      console.error('Erro ao abrir modal do evento:', error);

    }

  } catch (error) {

      console.error('Erro ao abrir modal de recorrência:', error);

    }

  },

  eventDrop(info) {
    validateMovement(info);
  },

  eventResize(info) {
    validateMovement(info);
  },

  eventMouseEnter(info) {

    // Remove tooltips antigas
    document.querySelectorAll('.event-tooltip').forEach(existingTooltip => {
      existingTooltip.remove();
    });

    const tooltip = document.createElement('div');
    tooltip.className = 'event-tooltip';

    const startDate = info.event.start
      ? new Date(info.event.start).toLocaleDateString('pt-BR')
      : '-';

    tooltip.innerHTML = `
      <strong>${info.event.title}</strong>

      <div class="event-tooltip-row">
        👤 <b>Responsável:</b> ${info.event.extendedProps.owner || '-'}
      </div>

      <div class="event-tooltip-row">
        🏷 <b>Categoria:</b> ${info.event.extendedProps.category || '-'}
      </div>

      <div class="event-tooltip-row">
        📅 <b>Data:</b> ${startDate}
      </div>

      <div class="event-tooltip-row">
        🕒 <b>Hora:</b> ${info.event.extendedProps.time || 'Não definida'}
      </div>

      <div class="event-tooltip-row">
        📝 <b>Descrição:</b> ${info.event.extendedProps.description || 'Sem descrição'}
      </div>

      <div class="event-tooltip-row">
        👥 <b>Convidados:</b> ${info.event.extendedProps.guests || 'Nenhum'}
      </div>
    `;

    document.body.appendChild(tooltip);

    const rect = info.el.getBoundingClientRect();

    tooltip.style.top = `${rect.top + window.scrollY - tooltip.offsetHeight - 12}px`;
    tooltip.style.left = `${rect.left + window.scrollX}px`;

    info.el.tooltipElement = tooltip;

  },

  eventMouseLeave(info) {

    if (info.el.tooltipElement) {
      info.el.tooltipElement.remove();
      info.el.tooltipElement = null;
    }

  }

  }

});

calendar.render();

// =========================================================
// TITLE
// =========================================================

function updateCalendarTitle() {
  document.getElementById('calendarTitle').innerText = calendar.view.title;
}

updateCalendarTitle();

// =========================================================
// NAVIGATION
// =========================================================

document.getElementById('prevBtn').addEventListener('click', () => {
  calendar.prev();
  updateCalendarTitle();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  calendar.next();
  updateCalendarTitle();
});

// =========================================================
// FILTERS
// =========================================================

const categoryFilter = document.getElementById('categoryFilter');
const personFilter = document.getElementById('personFilter');

function renderFilters() {

  categoryFilter.innerHTML = '<option value="all">Todas Categorias</option>';

  categories.forEach(category => {
    categoryFilter.innerHTML += `<option value="${category.name}">${category.name}</option>`;
  });

  const people = [...new Set(events.map(event => event.extendedProps.owner))];

  personFilter.innerHTML = '<option value="all">Todas Pessoas</option>';

  people.forEach(person => {
    personFilter.innerHTML += `<option value="${person}">${person}</option>`;
  });

}

renderFilters();

function applyFilters() {

  const selectedCategory = categoryFilter.value;
  const selectedPerson = personFilter.value;

  calendar.removeAllEvents();

  const filtered = events.filter(event => {

    const categoryMatch = selectedCategory === 'all' || event.extendedProps.category === selectedCategory;

    const personMatch = selectedPerson === 'all' || event.extendedProps.owner === selectedPerson;

    return categoryMatch && personMatch;
  });

  filtered.forEach(event => {
    calendar.addEvent(event);
  });

}

categoryFilter.addEventListener('change', applyFilters);
personFilter.addEventListener('change', applyFilters);

// =========================================================
// PERIOD FILTER
// =========================================================

const periodFilter = document.getElementById('periodFilter');

periodFilter.addEventListener('change', (e) => {

  if (e.target.value === 'month') {
    calendar.changeView('dayGridMonth');
  }

  if (e.target.value === 'week') {
    calendar.changeView('timeGridWeek');
  }

  if (e.target.value === 'year') {
    calendar.changeView('multiMonthYear');
  }

  updateCalendarTitle();

});

// =========================================================
// LEGEND
// =========================================================

function renderLegend() {

  const legendContainer = document.getElementById('legendContainer');

  legendContainer.innerHTML = '';

  categories.forEach(category => {

    legendContainer.innerHTML += `
      <div class="legend-item">
        <div class="legend-color" style="background:${category.color}"></div>
        <span>${category.name}</span>
      </div>
    `;

  });

}

renderLegend();

// =========================================================
// MODALS
// =========================================================

const eventModalOverlay = document.getElementById('eventModalOverlay');
const categoryModalOverlay = document.getElementById('categoryModalOverlay');

function openEventModal() {

  // Fecha tooltips abertas
  document.querySelectorAll('.event-tooltip').forEach(tooltip => {
    tooltip.remove();
  });
  eventModalOverlay.style.display = 'flex';
}

function closeEventModal() {
  eventModalOverlay.style.display = 'none';
}

function openCategoryModal() {
  categoryModalOverlay.style.display = 'flex';
}

function closeCategoryModal() {
  categoryModalOverlay.style.display = 'none';
}

// =========================================================
// EVENT MODAL
// =========================================================

function populateCategorySelect() {

  const select = document.getElementById('eventCategory');

  select.innerHTML = '';

  categories.forEach(category => {
    select.innerHTML += `<option value="${category.name}">${category.name}</option>`;
  });

}

populateCategorySelect();

function toggleDeleteButton() {

  const deleteButton = document.getElementById('deleteEventBtn');
  const eventId = document.getElementById('eventId').value;

  if (!eventId) {
    deleteButton.style.display = 'none';
  } else {
    deleteButton.style.display = 'inline-flex';
  }

}

function clearEventModal() {

  document.getElementById('eventId').value = '';
  document.getElementById('eventOwner').value = '';
  document.getElementById('eventTitleInput').value = '';
  document.getElementById('eventDate').value = '';
  document.getElementById('eventGuests').value = '';
  document.getElementById('eventDescription').value = '';
  document.getElementById('eventRecurrence').value = 'none';

  toggleDeleteButton();

}

function fillEventModal(event) {

  document.getElementById('eventId').value = event.id;
  document.getElementById('eventOwner').value = event.extendedProps.owner;
  document.getElementById('eventTitleInput').value = event.title;
  document.getElementById('eventCategory').value = event.extendedProps.category;
  document.getElementById('eventDate').value = event.startStr.split('T')[0];
  document.getElementById('eventGuests').value = event.extendedProps.guests || '';
  document.getElementById('eventTime').value = event.extendedProps.time || '';
  document.getElementById('eventDescription').value = event.extendedProps.description || '';

  toggleDeleteButton();

}

// =========================================================
// SAVE EVENT
// =========================================================

function createRecurringEvents(baseEvent, recurrence) {

  const recurring = [];

  const startDate = new Date(baseEvent.start);

  for (let i = 1; i <= 12; i++) {

    const newDate = new Date(startDate);

    if (recurrence === 'weekly') {
      newDate.setDate(newDate.getDate() + (7 * i));
    }

    if (recurrence === 'monthly') {
      newDate.setMonth(newDate.getMonth() + i);
    }

    recurring.push({
      ...baseEvent,
      id: baseEvent.id + '-' + i,
      start: newDate.toISOString().split('T')[0]
    });

  }

  return recurring;

}

function saveEvent() {

  console.log('▶ Executando saveEvent');

  const id = document.getElementById('eventId').value;
  const owner = document.getElementById('eventOwner').value.trim();
  const title = document.getElementById('eventTitleInput').value.trim();
  const category = document.getElementById('eventCategory').value;
  const date = document.getElementById('eventDate').value;
  const recurrence = document.getElementById('eventRecurrence').value;

  if (!owner || !title || !date) {
    alert('Preencha os campos obrigatórios.');
    return;
  }

  const categoryData = categories.find(cat => cat.name === category);

  const recurrenceGroupId = 'rec-' + Date.now();

  const payload = {
    id: id || String(Date.now()),
    title,
    start: date,
    backgroundColor: categoryData.color,
    borderColor: categoryData.color,
    extendedProps: {
      owner,
      category,
      time: document.getElementById('eventTime').value || '',
      guests: document.getElementById('eventGuests').value,
      description: document.getElementById('eventDescription').value,
      recurrenceGroup: recurrence !== 'none' ? recurrenceGroupId : null
    }
  };

  if (id) {

    const existing = calendar.getEventById(id);

    const recurrenceGroup = existing.extendedProps.recurrenceGroup;

    if (recurrenceEditMode === 'series' && recurrenceGroup) {

      calendar.getEvents().forEach(eventItem => {

        if (eventItem.extendedProps.recurrenceGroup === recurrenceGroup) {

          eventItem.setProp('title', title);
          eventItem.setExtendedProp('owner', owner);
          eventItem.setExtendedProp('category', category);
          eventItem.setProp('backgroundColor', categoryData.color);
          eventItem.setProp('borderColor', categoryData.color);

        }

      });

    } else {

      existing.setProp('title', title);
      existing.setStart(date);
      existing.setExtendedProp('owner', owner);
      existing.setExtendedProp('category', category);
      existing.setExtendedProp('guests', document.getElementById('eventGuests').value);
      existing.setExtendedProp('description', document.getElementById('eventDescription').value);
      existing.setExtendedProp('time', document.getElementById('eventTime').value || '');
      existing.setProp('backgroundColor', categoryData.color);
      existing.setProp('borderColor', categoryData.color);
      existing.setProp('borderColor', categoryData.color);

      const index = events.findIndex(item => item.id === id);

      if (index !== -1) {
        events[index] = {
          ...events[index],
          title,
          start: date,
          backgroundColor: categoryData.color,
          borderColor: categoryData.color,
          extendedProps: {
            ...events[index].extendedProps,
            owner,
            category
          }
        };
      }

    }

  } else {

    calendar.addEvent(payload);
    events.push(payload);

    if (recurrence !== 'none') {

      const recurringEvents = createRecurringEvents(payload, recurrence);

      recurringEvents.forEach(event => {
        calendar.addEvent(event);
        events.push(event);
      });

    }

  }

  renderFilters();
  applyFilters();
  closeEventModal();

  console.log('✔ Evento salvo com sucesso');

  console.log('✔ Evento excluído com sucesso');

}

function openDeleteOptionsModal(callback) {

  const existingModal = document.getElementById('deleteOptionsModal');

  if (existingModal) {
    existingModal.remove();
  }

  const modal = document.createElement('div');
  modal.id = 'deleteOptionsModal';
  modal.className = 'custom-delete-modal';

  modal.innerHTML = `
    <div class="custom-delete-content">
      <h3>Excluir Evento</h3>

      <p>Escolha como deseja excluir:</p>

      <button id="deleteSingleBtn" class="danger-btn">
        Excluir Recorrência
      </button>

      <small>
        Esta opção excluirá apenas a data selecionada.
      </small>

      <button id="deleteSeriesBtn" class="danger-btn secondary">
        Excluir Toda a Série
      </button>

      <small>
        Esta opção excluirá toda a série do Evento.
      </small>

      <button id="cancelDeleteBtn" class="neutral-btn">
        Cancelar
      </button>
    </div>
  `;

  document.body.appendChild(modal);

  document.getElementById('deleteSingleBtn').onclick = () => {
    modal.remove();
    callback('single');
  };

  document.getElementById('deleteSeriesBtn').onclick = () => {
    modal.remove();
    callback('series');
  };

  document.getElementById('cancelDeleteBtn').onclick = () => {
    modal.remove();
  };

}

async function deleteEvent() {

  console.log('▶ Executando deleteEvent');

  const eventIdField = document.getElementById('eventId');

  if (!eventIdField) {
    throw new Error('Campo eventId não encontrado');
  }

  const id = eventIdField.value;

  if (!id || id.trim() === '') {
    alert('Nenhum evento selecionado para exclusão.');
    return;
  }

  const selectedEvent = calendar.getEventById(id);

  if (!selectedEvent) {
    alert('Evento não encontrado no calendário.');
    return;
  }

  const recurrenceGroup = selectedEvent.extendedProps?.recurrenceGroup || null;

  let deleteMode = 'single';

  if (recurrenceGroup) {

    openDeleteOptionsModal((selectedMode) => {

      executeDelete(selectedMode, recurrenceGroup, selectedEvent, id);

    });

    return;

  }

    if (userChoice === '1') {
      deleteMode = 'single';
    } else if (userChoice === '2') {
      deleteMode = 'series';
    } else {
      alert('Opção inválida. Utilize apenas 1 ou 2.');
      return;
    }

  }

  executeDelete('single', recurrenceGroup, selectedEvent, id);

}

function executeDelete(deleteMode, recurrenceGroup, selectedEvent, id) {

  const confirmDelete = window.confirm('Deseja confirmar a exclusão?');

  if (!confirmDelete) {
    return;
  }

  try {

    if (deleteMode === 'series' && recurrenceGroup) {

      const seriesEvents = calendar.getEvents().filter(calendarEvent => {
        return calendarEvent.extendedProps?.recurrenceGroup === recurrenceGroup;
      });

      seriesEvents.forEach(calendarEvent => {
        calendarEvent.remove();
      });

      events = events.filter(eventItem => {
        return eventItem.extendedProps?.recurrenceGroup !== recurrenceGroup;
      });

      console.log('✔ Série completa removida');

    } else {

      selectedEvent.remove();

      events = events.filter(eventItem => {
        return eventItem.id !== id;
      });

      console.log('✔ Recorrência individual removida');

    }

    renderFilters();
    applyFilters();
    closeEventModal();

    document.querySelectorAll('.event-tooltip').forEach(tooltip => {
      tooltip.remove();
    });

    alert('Evento excluído com sucesso.');

  } catch (error) {

    console.error('Erro crítico ao excluir evento:', error);
    alert('Ocorreu um erro ao excluir o evento.');

  }

}

function saveCategory() {

  const warning = document.getElementById('categoryWarning');

  warning.innerText = '';

  const name = document.getElementById('categoryName').value.trim();
  const color = document.getElementById('categoryColor').value.toUpperCase();

  if (!name) {
    warning.innerText = 'Informe o nome da categoria.';
    return;
  }

  const duplicateName = categories.find(cat => cat.name.toLowerCase() === name.toLowerCase());

  if (duplicateName) {
    warning.innerText = 'Já existe uma categoria com esse nome.';
    return;
  }

  const duplicateColor = categories.find(cat => cat.color === color);

  if (duplicateColor) {
    warning.innerText = `A cor já pertence à categoria ${duplicateColor.name}.`;
    return;
  }

  categories.push({
    id: Date.now(),
    name,
    color
  });

  renderLegend();
  renderFilters();
  populateCategorySelect();

  closeCategoryModal();

}
